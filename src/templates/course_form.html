{% extends "base.html" %}
{% block title %}{{ '编辑课程' if course else '新增课程' }} - 学生信息管理系统{% endblock %}
{% block content %}
<h2>{{ '编辑课程' if course else '新增课程' }}</h2>
<form method="post" class="form">
    <div class="form-row">
        <label>课程编号 *</label>
        <input type="text" name="course_no" value="{{ course['course_no'] if course else '' }}" required>
    </div>
    <div class="form-row">
        <label>课程名称 *</label>
        <input type="text" name="name" value="{{ course['name'] if course else '' }}" required>
    </div>
    <div class="form-row">
        <label>学分</label>
        <input type="number" step="0.5" name="credit" value="{{ course['credit'] if course else '' }}">
    </div>
    <div class="form-row">
        <label>学时</label>
        <input type="number" name="hours" value="{{ course['hours'] if course else '' }}">
    </div>
    <div class="form-row">
        <label>任课教师</label>
        <input type="text" name="teacher" value="{{ course['teacher'] if course else '' }}">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('course.index') }}" class="btn">返回</a>
    </div>
</form>
{% endblock %}
