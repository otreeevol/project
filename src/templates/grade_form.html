{% extends "base.html" %}
{% block title %}{{ '编辑成绩' if grade else '录入成绩' }} - 学生信息管理系统{% endblock %}
{% block content %}
<h2>{{ '编辑成绩' if grade else '录入成绩' }}</h2>
<form method="post" class="form">
    <div class="form-row">
        <label>学生 *</label>
        <select name="student_id" required>
            <option value="">请选择学生</option>
            {% for s in students %}
            <option value="{{ s['id'] }}" {{ 'selected' if grade and grade['student_id'] == s['id'] }}>{{ s['student_no'] }} {{ s['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label>课程 *</label>
        <select name="course_id" required>
            <option value="">请选择课程</option>
            {% for c in courses %}
            <option value="{{ c['id'] }}" {{ 'selected' if grade and grade['course_id'] == c['id'] }}>{{ c['course_no'] }} {{ c['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label>成绩（0~100）*</label>
        <input type="number" step="0.5" min="0" max="100" name="score" value="{{ grade['score'] if grade else '' }}" required>
    </div>
    <div class="form-row">
        <label>学期</label>
        <input type="text" name="semester" value="{{ grade['semester'] if grade else '' }}" placeholder="如 2025-2026-1">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('grade.index') }}" class="btn">返回</a>
    </div>
</form>
{% endblock %}
