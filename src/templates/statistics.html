{% extends "base.html" %}
{% block title %}成绩统计 - 学生信息管理系统{% endblock %}
{% block content %}
<div class="page-header">
    <h2>成绩统计</h2>
    <form method="get" class="inline-form">
        <select name="course_id">
            <option value="">全部课程</option>
            {% for c in courses %}
            <option value="{{ c['id'] }}" {{ 'selected' if course_id == c['id'] }}>{{ c['name'] }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn">统计</button>
    </form>
</div>
<div class="cards">
    <div class="card">
        <div class="card-num">{{ stats.count }}</div>
        <div class="card-label">成绩条数</div>
    </div>
    <div class="card">
        <div class="card-num">{{ stats.avg }}</div>
        <div class="card-label">平均分</div>
    </div>
    <div class="card">
        <div class="card-num">{{ stats.max }}</div>
        <div class="card-label">最高分</div>
    </div>
    <div class="card">
        <div class="card-num">{{ stats.min }}</div>
        <div class="card-label">最低分</div>
    </div>
    <div class="card">
        <div class="card-num">{{ stats.pass_rate }}%</div>
        <div class="card-label">及格率</div>
    </div>
</div>
{% endblock %}
